<style>
/* ═══════════════════════════════════════════════════════════════
   KVI — токены оформления

   Две поверхности:
     «бумага» — по умолчанию. Исследовательский документ: плотная
       кириллица 13–14px читается тёмным по светлому и печатается.
     «поле» (.field) — только под графики. Тёмный фон за 251 точкой
       с одной яркой диагональю читается как трансляционная графика.

   Тёмная тема здесь — это состояние блока, а не настройка пользователя,
   поэтому она задана классом, а не media-query.

   Смысловых оттенков ровно два (зелёный ≈155°, красно-оранжевый ≈15°)
   плюс серый. Синий акцент отвечает ТОЛЬКО за взаимодействие и никогда
   не попадает на данные — иначе «зелёный» означает одновременно
   «недооценён» и «выбрано».
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── поверхности ─────────────────────────────────────────── */
  --surface-0: #F7F6F3;   /* фон страницы — тёплый, не чистый белый */
  --surface-1: #FFFFFF;   /* панели, тело таблицы */
  --surface-2: #EFEDE8;   /* шапка таблицы, врезки */
  --surface-3: #E4E1DA;   /* наведение, нажатое состояние */

  /* ── текст ───────────────────────────────────────────────── */
  --ink-1: #15181C;       /* основной        17.4:1 на surface-1 */
  --ink-2: #474D55;       /* вторичный        8.3:1 */
  --ink-3: #666C74;       /* подписи   ≥4.53:1 на всех трёх поверхностях */
  --ink-4: #A2A8AF;       /* ТОЛЬКО не-текст: сетка, выключенные метки */

  /* ── линейки ─────────────────────────────────────────────── */
  --rule-1: #E2DED6;      /* волосок между строками */
  --rule-2: #C6C1B6;      /* края панелей, границы полос категорий */
  --rule-3: #15181C;      /* линия справедливой цены — полная краска */

  /* Цвет метки и цвет текста — разные задачи: метке нужен контраст 3:1
     как не-тексту, подписи 4.5:1 как тексту. Поэтому пара токенов. */
  /* ── смысловая шкала: недооценён → переоценён ────────────── */
  --val-under-strong: #0E7A4F;
  --val-under:        #57A97D;
  --val-fair:         #8C8880;
  --val-over:         #D08A3C;
  --val-over-strong:  #A33720;

  --val-under-strong-ink: #0E7A4F;
  --val-under-ink:        #407B5B;
  --val-fair-ink:         #474D55;
  --val-over-ink:         #96632B;
  --val-over-strong-ink:  #A33720;

  /* ── отсутствие данных ───────────────────────────────────── */
  --missing-ink: #98928A;
  --missing-hatch: repeating-linear-gradient(45deg,
      rgba(21, 24, 28, .16) 0 1px, transparent 1px 7px);

  /* ── акцент: только взаимодействие ───────────────────────── */
  --accent:      #1F5FD0;
  --accent-weak: rgba(31, 95, 208, .10);
  --accent-ink:  #FFFFFF;

  /* ── отступы, шаг 4px ────────────────────────────────────── */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* ── скругления: два значения ────────────────────────────── */
  --r-0: 0;        /* панели, фигуры, таблицы — инструмент прямоугольный */
  --r-1: 3px;      /* только то, что нажимают */
  --r-full: 999px;

  /* ── шрифты ──────────────────────────────────────────────── */
  --ff-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ff-display: "Onest", "Golos Text", system-ui, sans-serif;

  --fs-d1: 60px; --fs-d2: 38px; --fs-d3: 25px;
  --fs-h1: 20px; --fs-h2: 15px; --fs-body: 14px;
  --fs-ui: 13px; --fs-num: 13px; --fs-cap: 12px; --fs-micro: 11px;
  --lh-tight: 1.02; --lh-snug: 1.22; --lh-ui: 1.4; --lh-prose: 1.55;

  /* ── движение ────────────────────────────────────────────── */
  --dur-1: 90ms;    /* наведение, нажатие */
  --dur-2: 160ms;   /* смена состояния */
  --dur-3: 240ms;   /* панель, оверлей */
  --ease-out: cubic-bezier(.2, .8, .3, 1);
  --ease-inout: cubic-bezier(.4, 0, .2, 1);

  --hair: 1px solid var(--rule-1);
  --edge: 1px solid var(--rule-2);
}

/* ── тёмная поверхность под графики: те же имена, другие значения ── */
.field {
  --surface-0: #12151A;
  --surface-1: #171B21;
  --surface-2: #1E232B;
  --surface-3: #272E38;

  --ink-1: #F2F4F6;
  --ink-2: #AFB7C1;
  --ink-3: #8D959F;   /* 4.8:1 на surface-1 */
  --ink-4: #4A525C;

  --rule-1: #262C35;
  --rule-2: #39414C;
  --rule-3: #F2F4F6;  /* диагональ инвертируется */

  --val-under-strong: #35D48B;
  --val-under:        #6FBF97;
  --val-fair:         #949CA6;
  --val-over:         #E8A85C;
  --val-over-strong:  #F0603F;

  --accent: #7BA6FF;
  --accent-weak: rgba(123, 166, 255, .16);
  --accent-ink: #0B0E14;

  --missing-ink: #7D858F;
  --val-under-strong-ink: #35D48B;
  --val-under-ink: #6FBF97;
  --val-fair-ink: #AFB7C1;
  --val-over-ink: #E8A85C;
  --val-over-strong-ink: #F0603F;
  --missing-hatch: repeating-linear-gradient(45deg,
      rgba(242, 244, 246, .2) 0 1px, transparent 1px 7px);

  background: var(--surface-0);
  color: var(--ink-1);
}

/* ═══ основа: типографика, таблицы, контролы, фокус ═══ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface-0);
  color: var(--ink-1);
  font-family: var(--ff-ui);
  font-size: var(--fs-ui);
  line-height: var(--lh-ui);
  -webkit-font-smoothing: antialiased;
}

/* Всё, что стоит в колонке, набирается табличными цифрами.
   Дисплейная гарнитура сюда не допускается: у неё пропорциональные
   цифры, и колонка разъезжается. */
.num, table, th, td, .stat__val, .kv b, .fig__v {
  font-family: var(--ff-ui);
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
  letter-spacing: 0;
}
svg text { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

h1, h2, h3, h4 { margin: 0; font-weight: 600; }

.display {
  font-family: var(--ff-display);
  font-weight: 700;
  letter-spacing: -.015em;
  line-height: var(--lh-tight);
}
/* Жёсткий стоп: дисплейная гарнитура не может просочиться в колонку. */
td .display, th .display, .kv .display, .axis .display { font-family: var(--ff-ui) !important; }

.d1 { font-size: var(--fs-d1); }
.d2 { font-size: var(--fs-d2); }
.d3 { font-size: var(--fs-d3); }

.h1 { font-size: var(--fs-h1); line-height: var(--lh-snug); }
.h2 { font-size: var(--fs-h2); line-height: var(--lh-snug); }
.prose { font-size: var(--fs-body); line-height: var(--lh-prose); max-width: 68ch; color: var(--ink-2); }
.prose strong { color: var(--ink-1); font-weight: 600; }
.cap { font-size: var(--fs-cap); color: var(--ink-3); line-height: 1.45; }
.overline {
  font-size: var(--fs-micro); font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Фокус виден всегда: в прежней версии стоял outline:none без замены. */
:where(a, button, input, select, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-1);
}
.field :where(a, button, [tabindex]):focus-visible { outline-color: var(--accent); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: var(--s-3); top: -60px; z-index: 300;
  background: var(--accent); color: var(--accent-ink);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-1);
  transition: top var(--dur-1) var(--ease-out);
}
.skip-link:focus { top: var(--s-3); text-decoration: none; }

/* ── контролы ──────────────────────────────────────────────── */
button, input, select { font: inherit; color: inherit; }

.btn {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: 36px; padding: 0 var(--s-3);
  background: var(--surface-1); color: var(--ink-1);
  border: var(--edge); border-radius: var(--r-1);
  cursor: pointer;
  transition: background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn--quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn--quiet:hover { background: var(--surface-2); border-color: var(--rule-1); }
.btn--sm { min-height: 28px; font-size: var(--fs-cap); }

.input, select.input {
  min-height: 36px; padding: 0 var(--s-2);
  background: var(--surface-1); color: var(--ink-1);
  border: var(--edge); border-radius: var(--r-1);
  transition: border-color var(--dur-1) var(--ease-out);
  width: 100%;
}
.input:hover { border-color: var(--ink-4); }

.seg { display: inline-flex; border: var(--edge); border-radius: var(--r-1); overflow: hidden; }
.seg button {
  min-height: 36px; padding: 0 var(--s-3); border: 0; cursor: pointer;
  background: var(--surface-1); color: var(--ink-2);
  border-right: 1px solid var(--rule-1);
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--ink-1); }

input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 24px; }

/* ── таблица ───────────────────────────────────────────────── */
table { border-collapse: separate; border-spacing: 0; width: 100%; }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--rule-2);
  padding: 0; text-align: left; white-space: nowrap;
}
thead th .th-btn {
  display: flex; align-items: center; gap: var(--s-1);
  width: 100%; min-height: 34px; padding: 0 var(--s-2);
  background: none; border: 0; cursor: pointer;
  font-size: var(--fs-micro); font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
  transition: color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out);
}
thead th .th-btn:hover { color: var(--ink-1); background: var(--surface-3); }
thead th[aria-sort] .th-btn { color: var(--ink-1); }
thead th.right .th-btn { justify-content: flex-end; }
.sort-ind { color: var(--accent); }

tbody td { padding: var(--s-2); border-bottom: var(--hair); white-space: nowrap; }
tbody td.right { text-align: right; }
tbody tr { transition: background var(--dur-1) var(--ease-out); }
tbody tr:hover td { background: var(--surface-2); }
tbody tr[aria-selected="true"] td { background: var(--accent-weak); }
tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.is-out td { color: var(--ink-3); }

/* ── отсутствие данных: 45° штриховка, всегда отличима от нуля ── */
.na {
  color: var(--missing-ink);
  border-bottom: 1px dotted var(--missing-ink);
  cursor: help;
}
.na-cell { background-image: var(--missing-hatch); }

/* ── ярлыки категорий: цвет + форма, а не только цвет ───────── */
.pill {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 2px var(--s-2); border-radius: var(--r-1);
  font-size: var(--fs-micro); font-weight: 600; white-space: nowrap;
  border: 1px solid;
}
.pill .glyph { font-size: 10px; line-height: 1; }
.pill--strong-under { color: var(--val-under-strong-ink); border-color: var(--val-under-strong); background: rgba(14,122,79,.08); }
.pill--under        { color: var(--val-under-ink);        border-color: var(--val-under);        background: rgba(87,169,125,.10); }
.pill--fair         { color: var(--val-fair-ink);         border-color: var(--rule-2);           background: var(--surface-2); }
.pill--over         { color: var(--val-over-ink);         border-color: var(--val-over);         background: rgba(208,138,60,.12); }
.pill--strong-over  { color: var(--val-over-strong-ink);  border-color: var(--val-over-strong);  background: rgba(163,55,32,.08); }

.tag {
  display: inline-block; padding: 0 var(--s-1);
  border: 1px solid var(--rule-2); border-radius: var(--r-1);
  font-size: var(--fs-micro); color: var(--ink-3);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══ оболочка, компоненты, виды ═══ */

.is-booting body { opacity: 0; }

/* ── верхняя панель ─────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--s-6);
  padding: var(--s-3) var(--s-5);
  background: var(--surface-0);
  border-bottom: 1px solid var(--rule-2);
}
.brand { display: flex; align-items: center; gap: var(--s-2); color: var(--ink-1); }
.brand:hover { text-decoration: none; }
.mark { width: 26px; height: 26px; flex: none; }
.brand__name { font-size: 19px; letter-spacing: -.02em; }
.brand__sub { font-size: var(--fs-micro); color: var(--ink-3); letter-spacing: .09em; text-transform: uppercase; }
.nav ul { display: flex; gap: var(--s-1); list-style: none; margin: 0; padding: 0; }
.nav a {
  display: block; padding: var(--s-2) var(--s-3); border-radius: var(--r-1);
  color: var(--ink-2); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink-1); }
.nav a[aria-current="page"] { color: var(--ink-1); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.topbar__right { margin-left: auto; }

.warnbar {
  margin: 0; padding: var(--s-2) var(--s-5);
  background: rgba(208, 138, 60, .14); color: #7A4E14;
  font-size: var(--fs-cap); border-bottom: 1px solid rgba(208, 138, 60, .3);
}
.integrity {
  padding: var(--s-3) var(--s-5); background: var(--val-over-strong); color: #fff;
  display: flex; flex-wrap: wrap; gap: var(--s-3); font-size: var(--fs-cap);
}
.integrity-failed .num, .integrity-failed .figure__v { text-decoration: line-through; opacity: .55; }

.view { padding: var(--s-6) var(--s-5) var(--s-9); max-width: 1500px; margin: 0 auto; outline: none; }
.view--explore { max-width: none; padding-left: 0; padding-right: 0; padding-top: 0; }

.foot {
  max-width: 1500px; margin: 0 auto; padding: var(--s-5);
  border-top: var(--hair); display: flex; flex-wrap: wrap; gap: var(--s-5);
  font-size: var(--fs-cap); color: var(--ink-3);
}

/* ── обзор ──────────────────────────────────────────────────── */
.lede { max-width: 780px; margin-bottom: var(--s-7); }
.lede h1 { margin-bottom: var(--s-4); }

.figures {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2);
  margin-bottom: var(--s-7);
}
.figure { padding: var(--s-4) var(--s-4) var(--s-4) 0; display: flex; flex-direction: column; gap: 2px; }
.figure + .figure { border-left: var(--hair); padding-left: var(--s-4); }
.figure__v { line-height: 1; }

.plot-section { padding: var(--s-6); border-radius: var(--r-0); margin-bottom: var(--s-7); }
.plot-section--inline { margin-bottom: 0; padding: var(--s-4); }
.plot-section--inline .plot { max-width: none; }
.plot-section__head { max-width: 640px; margin-bottom: var(--s-4); }
.plot-section__head h2 { color: var(--ink-1); }
.plot { width: 100%; max-width: 1120px; margin: 0 auto; }
.plot svg { display: block; width: 100%; height: auto; }

.two-col { display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--s-8); margin-bottom: var(--s-7); }
.two-col--tight { gap: var(--s-6); }

.toplist { list-style: none; margin: var(--s-4) 0 0; padding: 0; }
.toplist__row {
  display: grid; grid-template-columns: 28px 1fr 46px 120px 90px 64px;
  gap: var(--s-2); align-items: center;
  padding: var(--s-2) var(--s-1); border-bottom: var(--hair); cursor: pointer;
}
.toplist__row:hover { background: var(--surface-2); }
.toplist__n { color: var(--ink-3); }
.toplist__name { font-weight: 500; }
.toplist__club { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toplist__ui { text-align: right; }

.catbar { display: flex; height: 26px; margin: var(--s-4) 0 var(--s-3); border: var(--edge); }
.catbar__seg--strong-under { background: var(--val-under-strong); }
.catbar__seg--under { background: var(--val-under); }
.catbar__seg--fair { background: var(--val-fair); }
.catbar__seg--over { background: var(--val-over); }
.catbar__seg--strong-over { background: var(--val-over-strong); }
.catlist { list-style: none; margin: 0; padding: 0; }
.catlist li { display: grid; grid-template-columns: 1fr 44px 52px; gap: var(--s-2); align-items: center; padding: var(--s-1) 0; border-bottom: var(--hair); }
.catlist__n { text-align: right; font-weight: 600; }

.coverage { list-style: none; margin: var(--s-3) 0 0; padding: 0; }
.coverage li { display: grid; grid-template-columns: 34px 1fr 52px; gap: var(--s-2); align-items: center; padding: var(--s-1) 0; }
.coverage__track { height: 14px; background: var(--surface-2); display: flex; border: var(--hair); }
.coverage__track i { background: var(--ink-2); }
.coverage__track u { background-image: var(--missing-hatch); }
.coverage__p { text-align: right; }
.coverage--lg li { grid-template-columns: 44px 1fr 64px; }
.coverage--lg .coverage__track { height: 20px; }

.presets__row { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }
.preset { text-decoration: none; }

/* ── исследование: три колонки ──────────────────────────────── */
.explore { display: grid; grid-template-columns: 244px minmax(0, 1fr) 372px; min-height: calc(100vh - 120px); }
.rail {
  border-right: var(--edge); padding: var(--s-4); background: var(--surface-1);
  position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto;
}
.rail__grp { margin-bottom: var(--s-5); display: flex; flex-direction: column; gap: var(--s-2); }
.rail__grp .seg { width: 100%; }
.rail__grp .seg button { flex: 1; }
.rail__note { margin: calc(var(--s-4) * -1) 0 var(--s-5); }
.range { display: flex; flex-direction: column; gap: 2px; }
.range__out { display: block; color: var(--ink-2); }
.checks { display: flex; flex-direction: column; gap: var(--s-1); }
.check { display: flex; align-items: center; gap: var(--s-2); min-height: 28px; cursor: pointer; }

.results { padding: var(--s-4) var(--s-5); min-width: 0; }
.chipbar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; min-height: 32px; margin-bottom: var(--s-3); }
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: 28px; padding: 0 var(--s-2);
  background: var(--accent-weak); border: 1px solid transparent; border-radius: var(--r-1);
  color: var(--ink-1); cursor: pointer; font-size: var(--fs-cap);
}
.chip:hover { border-color: var(--accent); }
.rail-toggle { display: none; }
.results__head { display: flex; align-items: baseline; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-2); }
.results__actions { margin-left: auto; display: flex; gap: var(--s-2); align-items: center; }
.corrline { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; padding: var(--s-2) 0 var(--s-3); border-bottom: var(--hair); margin-bottom: var(--s-3); }
.cap--warn { color: #7A4E14; }
.field .cap--warn { color: var(--val-over); }

.tablewrap { overflow: auto; border: var(--edge); background: var(--surface-1); max-height: calc(100vh - 260px); }
.tablewrap--cmp { max-height: none; margin-top: var(--s-3); }
.star {
  background: none; border: 0; cursor: pointer; font-size: 15px; line-height: 1;
  color: var(--ink-3); padding: 0;
  /* Цель касания не меньше 28×28: сама глифа маленькая, площадь даёт кнопка. */
  min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center;
}
.star[aria-pressed="true"] { color: var(--val-over); }
.star:hover { color: var(--ink-1); }

.gap { position: relative; display: inline-block; width: 62px; height: 9px; background: var(--surface-2); vertical-align: middle; margin-right: var(--s-2); }
.gap__mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--rule-3); opacity: .5; }
.gap__bar { position: absolute; top: 1px; bottom: 1px; }
.gap__num { display: inline-block; min-width: 48px; text-align: right; }

.inspector { border-left: var(--edge); padding: var(--s-4); background: var(--surface-1); position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; }
.inspector__empty { padding: var(--s-6) 0; }
.inspector__actions { display: flex; gap: var(--s-2); margin: var(--s-3) 0; flex-wrap: wrap; }

/* ── карточка ───────────────────────────────────────────────── */
.card__head { border-bottom: var(--hair); padding-bottom: var(--s-3); margin-bottom: var(--s-4); }
.card__name { margin-bottom: var(--s-1); }
.card__meta { margin: 0 0 var(--s-3); color: var(--ink-3); font-size: var(--fs-cap); }
.card__headline { display: flex; align-items: flex-end; gap: var(--s-4); flex-wrap: wrap; }
.card__ui { display: flex; flex-direction: column; }
.card__uiv { line-height: .95; }
.card__badges { display: flex; align-items: center; gap: var(--s-3); padding-bottom: var(--s-1); flex-wrap: wrap; }
.card__rank { font-weight: 600; }
.card__rank-of { color: var(--ink-3); font-weight: 400; }
.card__sec { margin-bottom: var(--s-5); }
.card__sec h3 { margin-bottom: var(--s-2); }

.kvgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s-5); }
.kvgrid--1 { grid-template-columns: 1fr; }
.kv { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-1) 0; border-bottom: var(--hair); font-size: var(--fs-ui); }
.kv span { color: var(--ink-3); }
.kv b { font-weight: 600; }
.kv__delta { font-style: normal; font-size: var(--fs-micro); margin-left: var(--s-1); }
.kv__delta.is-up { color: var(--val-under-strong); }
.kv__delta.is-dn { color: var(--val-over-strong); }

/* ── водопад вкладов ────────────────────────────────────────── */
.wf { margin: var(--s-2) 0; }
.wf__head, .wf__row { display: grid; grid-template-columns: 1fr 52px minmax(90px, 1.2fr) 58px; gap: var(--s-2); align-items: center; }
.wf__head { font-size: var(--fs-micro); color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; padding-bottom: var(--s-1); border-bottom: var(--hair); }
.wf__row { padding: 3px 0; }
.wf__row--total { border-top: 1px solid var(--rule-2); margin-top: var(--s-1); padding-top: var(--s-2); font-weight: 600; }
.wf__label { font-size: var(--fs-cap); }
.wf__weight, .wf__val { text-align: right; font-size: var(--fs-cap); }
.wf__track { position: relative; height: 14px; background: var(--surface-2); }
.wf__mid { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--rule-2); }
.wf__bar { position: absolute; top: 2px; bottom: 2px; transition: width var(--dur-2) var(--ease-out), left var(--dur-2) var(--ease-out); }
.wf__row.is-na .wf__label { color: var(--missing-ink); }

/* ── графики ────────────────────────────────────────────────── */
.gridline { stroke: var(--rule-1); stroke-width: 1; }
.axlab { font-size: 11px; fill: var(--ink-3); }
.axtitle { font-size: 11px; fill: var(--ink-3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.fvline { stroke: var(--rule-3); stroke-width: 1.5; }
.fvband { stroke: var(--rule-2); stroke-width: 1; stroke-dasharray: 2 5; }
.fvlab { font-size: 11px; fill: var(--ink-3); letter-spacing: .04em; }
.trend { stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 5 4; opacity: .8; }
.pt { cursor: pointer; }
.pt .mark { transition: opacity var(--dur-2) var(--ease-out); }
.pt.is-dim .mark { opacity: .1; }
.pt.is-dim .hit { pointer-events: none; }
.pt:hover .mark, .pt:focus-visible .mark { stroke: var(--ink-1); stroke-width: 2; }
.pt.is-sel .mark { stroke: var(--ink-1); stroke-width: 2.4; }
.pt:focus { outline: none; }
.pt:focus-visible .hit { stroke: var(--accent); stroke-width: 2; }
.ptlab { font-size: 11px; fill: var(--ink-1); font-weight: 600; pointer-events: none; }
.ptlab.halo { stroke: var(--surface-0); stroke-width: 3.5; stroke-linejoin: round; paint-order: stroke; }
.dist__whisker { stroke: var(--rule-2); stroke-width: 1; }
.dist__box { fill: var(--surface-2); stroke: var(--rule-2); }
.dist__median { stroke: var(--ink-1); stroke-width: 2; }
.dist__dot { opacity: .65; }

.legend { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-3); font-size: var(--fs-cap); color: var(--ink-2); }
.legend__row { display: flex; flex-wrap: wrap; gap: var(--s-4); }
.legend__row--muted { color: var(--ink-3); }
.legend__item { display: inline-flex; align-items: center; gap: var(--s-1); }
.legend__glyph { font-size: 12px; }
.legend__size { display: inline-flex; align-items: center; gap: 3px; }
.legend__size i { display: block; border-radius: 50%; background: var(--ink-3); }
.legend__line { display: inline-block; width: 22px; height: 0; border-top: 1.5px solid var(--rule-3); }
.legend__line--dash { border-top-style: dashed; border-color: var(--rule-2); }

/* ── подсказка ──────────────────────────────────────────────── */
.tip {
  position: fixed; z-index: 200; pointer-events: none; width: 230px;
  background: var(--surface-1); color: var(--ink-1);
  border: 1px solid var(--rule-2); border-radius: var(--r-1);
  padding: var(--s-2) var(--s-3); font-size: var(--fs-cap);
  opacity: 0; transform: translateY(3px);
  transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
  box-shadow: 0 8px 24px rgba(21, 24, 28, .14);
}
.tip.is-on { opacity: 1; transform: none; }
.tip b { display: block; }
.tip__sub { display: block; color: var(--ink-3); margin-bottom: var(--s-1); }
.tip__r { display: flex; justify-content: space-between; gap: var(--s-3); color: var(--ink-3); }
.tip__r b { display: inline; color: var(--ink-1); }

/* ── профиль ────────────────────────────────────────────────── */
.backlink { margin: 0 0 var(--s-4); }
.profile { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-8); }
.profile__main { min-width: 0; }
.profile__actions { display: flex; gap: var(--s-2); margin-bottom: var(--s-5); }
.profile__side { border-left: var(--hair); padding-left: var(--s-5); }
.similar { list-style: none; margin: var(--s-2) 0; padding: 0; }
.similar li { display: grid; grid-template-columns: 1.4fr 48px 1fr 60px 110px; gap: var(--s-2); align-items: center; padding: var(--s-1) 0; border-bottom: var(--hair); }

/* ── сравнение ──────────────────────────────────────────────── */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); margin: var(--s-4) 0; }
.slot { border: var(--edge); padding: var(--s-3); display: flex; align-items: center; gap: var(--s-2); min-height: 56px; background: var(--surface-1); }
.slot--empty { border-style: dashed; color: var(--ink-3); }
.slot .btn { margin-left: auto; }
.slotadd { max-width: 380px; margin-bottom: var(--s-5); }
.scopebanner { padding: var(--s-3) var(--s-4); background: var(--surface-2); border-left: 3px solid var(--rule-2); margin-bottom: var(--s-5); font-size: var(--fs-cap); line-height: 1.5; }
.scopebanner.is-warn { background: rgba(208, 138, 60, .12); border-left-color: var(--val-over); }
.cmp { margin-bottom: var(--s-7); }

/* ── методология ────────────────────────────────────────────── */
.method { max-width: 980px; }
.method section { margin: var(--s-7) 0; }
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-2); list-style: none; padding: 0; margin: var(--s-5) 0; counter-reset: step; }
.pipeline li { border-top: 2px solid var(--rule-3); padding-top: var(--s-2); display: flex; flex-direction: column; gap: 2px; counter-increment: step; }
.pipeline li b::before { content: counter(step) ". "; color: var(--ink-3); font-weight: 400; }
.thresholds { list-style: none; padding: 0; margin: var(--s-2) 0; }
.thresholds li { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-1) 0; border-bottom: var(--hair); }
.limits { padding-left: var(--s-4); }
.limits li { margin-bottom: var(--s-2); }

.empty { padding: var(--s-8) var(--s-4); text-align: center; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }

/* ── адаптив ────────────────────────────────────────────────── */
@media (max-width: 1400px) {
  .explore { grid-template-columns: 252px minmax(0, 1fr); }
  .inspector { display: none; }
  .explore.has-sel .inspector {
    display: block; position: fixed; right: 0; top: 57px; bottom: 0; width: 380px; z-index: 30;
    box-shadow: -12px 0 32px rgba(21, 24, 28, .12);
  }
}
@media (max-width: 1100px) {
  .two-col, .profile { grid-template-columns: 1fr; gap: var(--s-6); }
  .profile__side { border-left: 0; padding-left: 0; border-top: var(--hair); padding-top: var(--s-5); }
  .figures { grid-template-columns: repeat(3, 1fr); }
  .figure:nth-child(4) { border-left: 0; padding-left: 0; }
  .pipeline { grid-template-columns: repeat(2, 1fr); }
  .slots { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; gap: var(--s-3); padding: var(--s-2) var(--s-4); }
  .nav { order: 3; width: 100%; overflow-x: auto; }
  .nav ul { flex-wrap: nowrap; }
  .view { padding: var(--s-5) var(--s-4) var(--s-8); }
  .figures { grid-template-columns: repeat(2, 1fr); }
  .figure { border-left: 0 !important; padding-left: 0 !important; border-top: var(--hair); }
  .explore { display: block; }
  .rail {
    position: static; max-height: none; border-right: 0; border-bottom: var(--edge);
    display: none;
  }
  .explore.rail-open .rail { display: block; }
  .rail-toggle { display: inline-flex; }
  .results { padding: var(--s-4); }
  .tablewrap { max-height: none; }
  .toplist__row { grid-template-columns: 24px 1fr 60px; }
  .toplist__club, .toplist__gap { display: none; }
  .pipeline, .slots { grid-template-columns: 1fr; }
  /* На телефоне карточка — лист снизу, а не боковая панель. */
  .explore.has-sel .inspector {
    display: block; position: fixed; inset: auto 0 0 0; top: 35%; width: auto;
    border-top: 2px solid var(--rule-3); border-left: 0; z-index: 60;
  }
  .plot-section { padding: var(--s-3); }
}

</style>

/** Выборочное стандартное отклонение (делитель n−1), как в книге. */
function sdev(a) {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
}
function median(a) {
  if (!a.length) return null;
  const b = [...a].sort((x, y) => x - y);
  const h = b.length >> 1;
  return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2;
}
function quantile(sorted, f) {
  if (!sorted.length) return null;
  const pos = (sorted.length - 1) * f;
  const b = Math.floor(pos);
  const r = pos - b;
  return sorted[b + 1] !== undefined ? sorted[b] + r * (sorted[b + 1] - sorted[b]) : sorted[b];
}
function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = mean(xs);
  const my = mean(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const a = xs[i] - mx;
    const b = ys[i] - my;
    sxy += a * b; sxx += a * a; syy += b * b;
  }
  return (sxx === 0 || syy === 0) ? null : sxy / Math.sqrt(sxx * syy);
}

function categorise(ui) {
  for (const c of CAT_THRESHOLDS) {
    // Границы в книге: >1, >0.5, >=-0.5, >=-1, иначе
    if (c.key === 'strong-under' && ui > 1) return c;
    if (c.key === 'under' && ui > 0.5) return c;
    if (c.key === 'fair' && ui >= -0.5) return c;
    if (c.key === 'over' && ui >= -1) return c;
    if (c.key === 'strong-over') return c;
  }
  return CAT_THRESHOLDS[2];
}

/* ─────────────────────────── поиск ─────────────────────────── */

const ASCII_RE = /^[\x20-\x7E]*$/;

/** Снимает диакритику и приводит к нижнему регистру: Bašić -> basic. */
function fold(s) {
  const raw = s || '';
  // Быстрый путь: большинство имён — чистый ASCII, NFD там не нужен.
  if (ASCII_RE.test(raw)) return raw.toLowerCase().trim();
  return raw
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[đĐ]/g, 'd').replace(/[łŁ]/g, 'l').replace(/[øØ]/g, 'o')
    .replace(/[ðÐ]/g, 'd').replace(/[þÞ]/g, 'th').replace(/ß/g, 'ss')
    .replace(/ё/g, 'е')
    .toLowerCase().trim();
}

/**
 * Диакритика несёт звук, который кириллица пишет отдельной буквой:
 * Bašić по-русски «Башич», а не «Басик». Раскрываем ДО снятия диакритики,
 * иначе š и s схлопываются и поиск по-русски перестаёт находить игрока.
 */
const DIACRITIC_SOUNDS = {
  š: 'sh', ž: 'zh', č: 'ch', ć: 'ch', ş: 'sh', ș: 'sh', ţ: 'ts', ț: 'ts',
  đ: 'dj', ď: 'd', ř: 'rzh', ń: 'n', ñ: 'n', ľ: 'l', ĺ: 'l', ů: 'u',
  ð: 'd', þ: 'th', ø: 'o', å: 'o', æ: 'ae', œ: 'oe', ß: 'ss', ı: 'i',
};

// Порядок важен: диграфы до одиночных букв.
const TRANSLIT = [
  ['shch', 'щ'], ['sch', 'щ'], ['zh', 'ж'], ['kh', 'х'], ['ch', 'ч'], ['sh', 'ш'],
  ['ts', 'ц'], ['ya', 'я'], ['yu', 'ю'], ['yo', 'ё'], ['ye', 'е'], ['iy', 'ий'],
  ['ay', 'ай'], ['ey', 'ей'], ['oy', 'ой'], ['uy', 'уй'], ['j', 'дж'],
  ['a', 'а'], ['b', 'б'], ['c', 'к'], ['d', 'д'], ['e', 'е'], ['f', 'ф'], ['g', 'г'],
  ['h', 'х'], ['i', 'и'], ['k', 'к'], ['l', 'л'], ['m', 'м'], ['n', 'н'], ['o', 'о'],
  ['p', 'п'], ['q', 'к'], ['r', 'р'], ['s', 'с'], ['t', 'т'], ['u', 'у'], ['v', 'в'],
  ['w', 'в'], ['x', 'кс'], ['y', 'ы'], ['z', 'з'],
];
// Один проход регуляркой вместо посимвольного перебора таблицы.
const TRANSLIT_MAP = Object.fromEntries(TRANSLIT);
const TRANSLIT_RE = new RegExp(TRANSLIT.map(([l]) => l).join('|'), 'g');
const DIACRITIC_RE = new RegExp(`[${Object.keys(DIACRITIC_SOUNDS).join('')}]`, 'g');

/** Латиница -> кириллица, чтобы «Астана» находила "FC Astana". */
function toCyrillic(latin) {
  const expanded = (latin || '').toLowerCase().replace(DIACRITIC_RE, (c) => DIACRITIC_SOUNDS[c]);
  return fold(expanded).replace(TRANSLIT_RE, (m) => TRANSLIT_MAP[m]);
}

// Клубов всего 16 на 301 игрока — считаем их ключи один раз.
const clubKeyCache = new Map();
function clubKey(club) {
  let k = clubKeyCache.get(club);
  if (k === undefined) {
    k = `${club} ${fold(club)} ${toCyrillic(club)}`;
    clubKeyCache.set(club, k);
  }
  return k;
}

/**
 * Один склеенный ключ на игрока. Интерфейс русский, а имена и клубы
 * латиницей — без транслитерации поиск по-русски не находит ничего.
 */
function buildSearchKey(p) {
  return `${p.name} ${fold(p.name)} ${toCyrillic(p.name)} ${clubKey(p.club)} ${p.pos} ${p.nat || ''}`.toLowerCase();
}

/** Запрос может быть на любой раскладке; сравниваем с обеими формами ключа. */
function matchesQuery(p, rawQuery) {
  const q = fold(rawQuery);
  if (!q) return true;
  return p.searchKey.includes(q) || p.searchKey.includes(toCyrillic(q));
}

/* ─────────────────────────── модель ─────────────────────────── */

/**
 * Считает модель ОДИН раз по всей популяции.
 *
 * Важно для научной корректности: μ, σ и нормализация берутся по всем
 * игрокам, прошедшим критерий включения, и НЕ пересчитываются при
 * фильтрации в интерфейсе. Фильтры только подмножество показывают —
 * эталонная популяция от этого не меняется.
 *
 * @param {Array<object>} rows сырые записи игроков
 * @returns {{players:Array, model:Array, stats:object, weff:object,
 *            coverage:object, r:number}}
 */
function buildModel(rows) {
  const players = rows.map((raw) => {
    const p = { ...raw };
    p.id = p.sf_id;               // единственный стабильный ключ: slug не уникален
    p.group = GROUP[p.pos] || '?';
    p.nat = p.nat || null;        // в данных 13 пустых строк — приводим к null

    // Причина исключения. Порядок тот же, что в книге; 6 игроков подходят
    // сразу под два условия, поэтому порядок влияет на разбивку в отчёте.
    p.excl = null;
    p.exclCode = null;
    if (p.group === 'GK') { p.exclCode = 'GK'; p.excl = 'Вратарь — вне модели по методологии'; }
    else if (p.group === '?') { p.exclCode = 'UNKNOWN_POS'; p.excl = 'Позиция не распознана'; }
    else if (p.mv === null || p.mv === undefined) { p.exclCode = 'NO_MV'; p.excl = 'Нет рыночной стоимости на дату среза'; }
    else if (p.minutes < MIN_MINUTES) { p.exclCode = 'BELOW_MINUTES'; p.excl = `Сыграно ${p.minutes} мин — меньше порога ${MIN_MINUTES}`; }
    p.inModel = !p.excl;

    // Производные на 90 минут — только показ, в модель не входят.
    const n90 = p.minutes / 90;
    p.g90 = n90 > 0 ? p.goals / n90 : null;
    p.a90 = n90 > 0 ? p.assists / n90 : null;
    p.kp90 = n90 > 0 ? p.key_passes / n90 : null;
    p.d90 = n90 > 0 ? p.duels_won / n90 : null;
    p.ga = p.goals + p.assists;

    // Вектор метрик. Отборы+перехваты — null, а НЕ ноль: метрика по лиге
    // не публикуется. Ноль означал бы измеренный ноль и при включении
    // метрики (AVAIL[3]=1) молча посчитался бы как реальное значение.
    p.metrics = [p.goals, p.assists, p.key_passes, null, p.duels_won, p.rating, p.minutes];
    p.searchKey = buildSearchKey(p);
    return p;
  });

  // Эффективные веса: вес недоступной метрики перераспределяется на собранные.
  const weff = {};
  const coverage = {};
  for (const g of ['FW', 'MF', 'DF']) {
    const den = W[g].reduce((s, w, i) => s + w * AVAIL[i], 0);
    weff[g] = W[g].map((w, i) => (w * AVAIL[i]) / den);
    coverage[g] = den;
  }

  const model = players.filter((p) => p.inModel);
  const stats = {};
  for (const g of ['FW', 'MF', 'DF']) {
    const sub = model.filter((p) => p.group === g);
    stats[g] = {
      n: sub.length,
      // Недоступные метрики не имеют μ и σ: считать среднее по несобранному
      // показателю нечего. Ниже это даёт z = null, а не z = 0.
      mu: METRICS.map((_, i) => (AVAIL[i] ? mean(sub.map((p) => p.metrics[i])) : null)),
      sd: METRICS.map((_, i) => (AVAIL[i] ? sdev(sub.map((p) => p.metrics[i])) : null)),
    };
  }

  for (const p of model) {
    const s = stats[p.group];
    p.z = p.metrics.map((x, i) => {
      if (!AVAIL[i] || x === null) return null;
      return s.sd[i] === 0 ? 0 : (x - s.mu[i]) / s.sd[i];
    });
    p.contrib = p.z.map((z, i) => (z === null ? null : weff[p.group][i] * z));
    p.kvi = p.contrib.reduce((a, c) => (c === null ? a : a + c), 0);
    const a = p.age;
    p.aaf = a < 25 ? 1 + 0.05 * (25 - a) / 10 : (a <= 29 ? 1 : 1 - 0.03 * (a - 29) / 10);
    p.kvi_adj = p.kvi * p.aaf;
  }

  for (const g of ['FW', 'MF', 'DF']) {
    const sub = model.filter((p) => p.group === g);
    const mk = mean(sub.map((p) => p.kvi_adj));
    const sk = sdev(sub.map((p) => p.kvi_adj));
    const mv = mean(sub.map((p) => p.mv));
    const sv = sdev(sub.map((p) => p.mv));
    Object.assign(stats[g], { mk, sk, mmv: mv, smv: sv });
    for (const p of sub) {
      p.nk = (p.kvi_adj - mk) / sk;
      p.nmv = (p.mv - mv) / sv;
      p.ui = p.nk - p.nmv;
      const c = categorise(p.ui);
      p.cat = c.label;
      p.catKey = c.key;
    }
    [...sub].sort((x, y) => y.ui - x.ui).forEach((p, i) => { p.rankGrp = i + 1; p.rankGrpN = sub.length; });
  }
  [...model].sort((a, b) => b.ui - a.ui).forEach((p, i) => { p.rankAll = i + 1; });
  [...model].sort((a, b) => b.kvi_adj - a.kvi_adj).forEach((p, i) => { p.rankKvi = i + 1; });

  const r = pearson(model.map((p) => p.nk), model.map((p) => p.nmv));

  // Паспорт модели: всё, что показывает экран «Методология», и всё,
  // против чего работает самопроверка. Считается здесь, а не в вёрстке.
  const byGroup = {};
  const rByGroup = {};
  const uiSpread = {};
  for (const g of ['FW', 'MF', 'DF']) {
    const sub = model.filter((p) => p.group === g);
    byGroup[g] = sub.length;
    rByGroup[g] = pearson(sub.map((p) => p.nk), sub.map((p) => p.nmv));
    uiSpread[g] = sdev(sub.map((p) => p.ui));
  }
  const exclusions = {};
  for (const p of players) if (p.exclCode) exclusions[p.exclCode] = (exclusions[p.exclCode] || 0) + 1;
  // 6 игроков подходят и под «нет стоимости», и под «мало минут»
  const bothNoMvAndShort = players.filter(
    (p) => p.group !== 'GK' && p.group !== '?' && (p.mv === null || p.mv === undefined) && p.minutes < MIN_MINUTES,
  ).length;
  const aafs = model.map((p) => p.aaf);

  const summary = {
    counts: {
      base: players.length,
      model: model.length,
      outfield: players.filter((p) => ['FW', 'MF', 'DF'].includes(p.group)).length,
      byGroup,
      exclusions,
      bothNoMvAndShort,
    },
    minMinutes: MIN_MINUTES,
    weights: W,
    weightsEff: weff,
    availability: AVAIL,
    coverage,
    correlation: { all: r, byGroup: rByGroup },
    uiSpread,
    aafRange: { min: Math.min(...aafs), max: Math.max(...aafs) },
    categoryCounts: Object.fromEntries(CAT_THRESHOLDS.map((c) => [c.key, model.filter((p) => p.catKey === c.key).length])),
  };

  return { players, model, stats, weff, coverage, r, summary };
}

/**
 * Самопроверка против опорных значений научной работы.
 * Вызывается при старте; при расхождении интерфейс обязан сказать об этом,
 * а не показывать тихо неверные цифры.
 */
function selfCheck(built) {
  const { players, model, coverage, r } = built;
  const counts = CATEGORIES.map((c) => model.filter((p) => p.cat === c).length);
  const cov = ['FW', 'MF', 'DF'].map((g) => Math.round(coverage[g] * 100));
  const checks = [
    ['всего в базе', players.length, 301],
    ['в модели', model.length, 251],
    ['Пирсон r', Number(r.toFixed(6)), 0.373767],
    ['категории', counts.join('/'), '46/36/99/35/35'],
    ['покрытие', cov.join('/'), '95/85/65'],
  ];
  const failed = checks.filter(([, got, want]) => String(got) !== String(want));
  return { ok: failed.length === 0, checks, failed };
}

/* ═══ форматирование, ярлыки и помощники DOM ═══ */



const NBSP = ' ';
const MINUS = '−'; // U+2212: ширина цифры, в отличие от дефиса
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** Знак минус вместо дефиса — иначе колонка чисел разъезжается. */
const sign = (s) => s.replace(/^-/, MINUS);
const f1 = (x) => (x == null ? '—' : sign(x.toFixed(1)));
const f2 = (x) => (x == null ? '—' : sign(x.toFixed(2)));
const f3 = (x) => (x == null ? '—' : sign((x > 0 ? '+' : '') + x.toFixed(3)));
const fInt = (x) => (x == null ? '—' : sign(Math.round(x).toLocaleString('ru-RU').replace(/\s/g, NBSP)));
const fEur = (x) => (x == null ? '—' : `${fInt(x)}${NBSP}€`);
const fEurShort = (x) => {
  if (x == null) return '—';
  if (x >= 1e6) return `${(x / 1e6).toFixed(2).replace('.', ',')}${NBSP}млн${NBSP}€`;
  return `${Math.round(x / 1000)}${NBSP}тыс${NBSP}€`;
};
const fPct = (x) => (x == null ? '—' : `${Math.round(x * 100)}${NBSP}%`);
const fDate = (iso) => (iso ? iso.split('-').reverse().join('.') : '—');
function plural(n, one, few, many) {
  const m = Math.abs(n) % 100;
  const d = m % 10;
  if (m > 10 && m < 20) return many;
  if (d > 1 && d < 5) return few;
  if (d === 1) return one;
  return many;
}
const nPlayers = (n) => `${n}${NBSP}${plural(n, 'игрок', 'игрока', 'игроков')}`;

/* ── категории: цвет + форма. Цвета одни недостаточны — при протанопии
   «Недооценён» и «Сильно переоценён» сливаются (ΔE 2.4). ── */
const CAT_META = {
  'strong-under': { label: 'Сильно недооценён', short: 'С. недооценён', glyph: '▲', shape: 'triangle-up', color: 'var(--val-under-strong)' },
  under: { label: 'Недооценён', short: 'Недооценён', glyph: '△', shape: 'triangle-up-open', color: 'var(--val-under)' },
  fair: { label: 'Справедливо оценён', short: 'Справедливо', glyph: '●', shape: 'circle', color: 'var(--val-fair)' },
  over: { label: 'Переоценён', short: 'Переоценён', glyph: '▽', shape: 'triangle-down-open', color: 'var(--val-over)' },
  'strong-over': { label: 'Сильно переоценён', short: 'С. переоценён', glyph: '▼', shape: 'triangle-down', color: 'var(--val-over-strong)' },
};
const catMeta = (key) => CAT_META[key] || CAT_META.fair;
const CAT_KEYS = CAT_THRESHOLDS.map((c) => c.key);
function catPill(key, { short = false } = {}) {
  const m = catMeta(key);
  return `<span class="pill pill--${key}"><span class="glyph" aria-hidden="true">${m.glyph}</span>${short ? m.short : m.label}</span>`;
}
const GROUP_LABEL = { FW: 'Нападение', MF: 'Полузащита', DF: 'Защита', GK: 'Вратари' };
const EXCL_LABEL = {
  GK: 'Вратарь — вне модели по методологии',
  UNKNOWN_POS: 'Позиция не распознана',
  NO_MV: 'Нет рыночной стоимости на дату среза',
  BELOW_MINUTES: 'Игровое время меньше порога',
};

/** Ячейка с отсутствующим значением: видимо иначе, чем ноль. */
function naCell(reason) {
  return `<span class="na" title="${esc(reason)}" aria-label="${esc(reason)}">—</span>`;
}

/* ── SVG ── */
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
/** Маркер категории: форма несёт ту же информацию, что и цвет. */
function catMarker(parent, x, y, size, key, extra = {}) {
  const m = catMeta(key);
  const s = size;
  let node;
  if (m.shape === 'circle') {
    node = svg('circle', { cx: x, cy: y, r: s, ...extra }, parent);
  } else {
    const up = m.shape.startsWith('triangle-up');
    const h = s * 1.5;
    const pts = up
      ? `${x},${y - h * 0.62} ${x - s * 1.15},${y + h * 0.38} ${x + s * 1.15},${y + h * 0.38}`
      : `${x},${y + h * 0.62} ${x - s * 1.15},${y - h * 0.38} ${x + s * 1.15},${y - h * 0.38}`;
    node = svg('polygon', { points: pts, ...extra }, parent);
  }
  const open = m.shape.endsWith('-open');
  node.setAttribute('fill', open ? 'none' : m.color);
  node.setAttribute('stroke', m.color);
  node.setAttribute('stroke-width', open ? 1.6 : 0.8);
  return node;
}

/** Объявление для скринридера: без него фильтрация происходит беззвучно. */
let liveNode = null;
function announce(msg) {
  if (!liveNode) liveNode = el('live');
  if (liveNode) liveNode.textContent = msg;
}
function debounce(fn, ms) {
  let t = null;
  return (...a) => { if (t) clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/** Коалесцируем отрисовку в кадр; при скрытой вкладке rAF не приходит. */
function frameSchedule(fn) {
  let pending = false;
  return () => {
    if (pending) return;
    pending = true;
    const run = () => { pending = false; fn(); };
    if (document.hidden) setTimeout(run, 0);
    else requestAnimationFrame(run);
  };
}
const collator = new Intl.Collator('ru');

/* ═══ состояние, маршрутизация и сохранение ═══

   Один принцип, из которого следует всё остальное:
   СОСТОЯНИЕ ПРИМЕНЯЕТСЯ ТОЛЬКО В ОБРАБОТЧИКЕ hashchange.
   Контролы не пишут в состояние напрямую — они пишут URL.
   Поэтому «назад/вперёд» работают по построению, а не отдельным кодом,
   и любую выборку можно отправить ссылкой.

   Маршрутизация по хэшу, а не History API. Две независимые причины:
   1) GitHub Pages по пути /KVI-Project/ отдаст 404 на /player/123;
   2) с file:// history.pushState бросает SecurityError, а файл должен
      открываться двойным кликом без сервера.                            */
const DEFAULTS = {
  q: '', grp: 'ALL', club: '', age: [17, 40], mv: [0, 1500000],
  min: [0, 3000], cat: [], nomodel: 0, list: 0,
  sort: 'ui', dir: -1, view: 'table', sel: null,
};
const KEY_ORDER = ['q', 'grp', 'club', 'age', 'mv', 'min', 'cat', 'nomodel', 'list', 'sort', 'dir', 'view', 'sel'];
const S = { route: 'overview', params: {}, filters: { ...DEFAULTS } };

const listeners = new Set();
const subscribe = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
const emit = (reason) => listeners.forEach((fn) => fn(reason));

/* ── сериализация фильтров ── */

const sameRange = (a, b) => a[0] === b[0] && a[1] === b[1];
function serializeFilters(f) {
  const out = [];
  for (const k of KEY_ORDER) {
    const v = f[k]; const d = DEFAULTS[k];
    if (Array.isArray(d)) {
      if (!sameRange(v, d)) out.push(`${k}=${v[0]}-${v[1]}`);
    } else if (k === 'cat') {
      if (v.length) out.push(`cat=${v.join(',')}`);
    } else if (v !== d && v !== null && v !== '') {
      out.push(`${k}=${encodeURIComponent(v)}`);
    }
  }
  return out.join('&');
}

/** Валидация идёт против реальных данных, а не против схемы. */
function parseFilters(qs, domain) {
  const f = { ...DEFAULTS, age: [...DEFAULTS.age], mv: [...DEFAULTS.mv], min: [...DEFAULTS.min], cat: [] };
  const bad = [];
  if (!qs) return { filters: f, bad };
  for (const pair of qs.split('&')) {
    if (!pair) continue;
    const i = pair.indexOf('=');
    const k = i < 0 ? pair : pair.slice(0, i);
    const raw = i < 0 ? '' : decodeURIComponent(pair.slice(i + 1));
    switch (k) {
      case 'q': f.q = raw.slice(0, 64); break;
      case 'grp': if (['ALL', 'FW', 'MF', 'DF'].includes(raw)) f.grp = raw; else bad.push(k); break;
      case 'club': if (!raw || domain.clubs.includes(raw)) f.club = raw; else bad.push(k); break;
      case 'sort': f.sort = raw; break;
      case 'dir': f.dir = raw === '1' ? 1 : -1; break;
      case 'view': if (['table', 'chart'].includes(raw)) f.view = raw; else bad.push(k); break;
      case 'sel': { const n = Number(raw); if (domain.ids.has(n)) f.sel = n; else bad.push(k); break; }
      case 'nomodel': f.nomodel = raw === '1' ? 1 : 0; break;
      case 'list': f.list = raw === '1' ? 1 : 0; break;
      case 'cat': f.cat = raw.split(',').filter((c) => CAT_KEYS.includes(c)); break;
      case 'age': case 'mv': case 'min': {
        const m = raw.match(/^(-?\d+)-(-?\d+)$/);
        if (!m) { bad.push(k); break; }
        const lo = Number(m[1]); const hi = Number(m[2]);
        const [dlo, dhi] = DEFAULTS[k];
        f[k] = [Math.max(dlo, Math.min(lo, dhi)), Math.max(dlo, Math.min(hi, dhi))];
        if (f[k][0] > f[k][1]) f[k] = [...DEFAULTS[k]];
        break;
      }
      default: bad.push(k);
    }
  }
  return { filters: f, bad };
}

/* ── маршруты ── */
function buildHash(route, params = {}, filters = null) {
  let h = '#/';
  if (route === 'explore') h = '#/explore';
  else if (route === 'player') h = `#/player/${params.id}`;
  else if (route === 'compare') h = '#/compare';
  else if (route === 'method') h = `#/method${params.section ? `/${params.section}` : ''}`;
  const parts = [];
  if (route === 'explore' && filters) { const s = serializeFilters(filters); if (s) parts.push(s); }
  if (route === 'player' && params.from) parts.push(`from=${encodeURIComponent(params.from)}`);
  if (route === 'compare' && params.ids?.length) parts.push(`ids=${params.ids.join(',')}`);
  return parts.length ? `${h}?${parts.join('&')}` : h;
}

function matchRoute(hash, domain) {
  const raw = hash.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  const path = (qi < 0 ? raw : raw.slice(0, qi)).replace(/\/$/, '');
  const qs = qi < 0 ? '' : raw.slice(qi + 1);
  const seg = path.split('/').filter(Boolean);

  if (!seg.length) return { route: 'overview', params: {}, qs };
  if (seg[0] === 'explore') return { route: 'explore', params: {}, qs };
  if (seg[0] === 'method') return { route: 'method', params: { section: seg[1] || '' }, qs };
  if (seg[0] === 'compare') {
    const m = /(?:^|&)ids=([^&]*)/.exec(qs);
    const ids = m ? decodeURIComponent(m[1]).split(',').map(Number).filter((n) => domain.ids.has(n)).slice(0, 4) : [];
    return { route: 'compare', params: { ids }, qs };
  }
  if (seg[0] === 'player' && seg[1]) {
    const id = Number(seg[1]);
    if (!domain.ids.has(id)) return { route: 'notfound', params: { what: `игрок ${seg[1]}` }, qs };
    const m = /(?:^|&)from=([^&]*)/.exec(qs);
    return { route: 'player', params: { id, from: m ? decodeURIComponent(m[1]) : '' }, qs };
  }
  return { route: 'notfound', params: { what: hash }, qs };
}

/* ── запись URL: непрерывные действия не засоряют историю ── */

let applying = false;
let lastApplied = '';
function go(route, params = {}, filters = null, { replace = false } = {}) {
  const h = buildHash(route, params, filters);
  if (h === location.hash) return;
  if (replace) history.replaceState(null, '', h);
  else location.hash = h;
  if (replace) apply();           // replaceState не вызывает hashchange
}

/** Непрерывные контролы (ввод, ползунки, выбор точки) — без новой записи. */
const goReplace = (route, params, filters) => go(route, params, filters, { replace: true });

let domainRef = { clubs: [], ids: new Set() };
const setDomain = (d) => { domainRef = d; };
let lastBadParams = [];

function apply() {
  if (applying) return;
  const hash = location.hash || '#/';
  if (hash === lastApplied) return;
  applying = true;
  lastApplied = hash;
  const m = matchRoute(hash, domainRef);
  const { filters, bad } = parseFilters(m.qs, domainRef);
  lastBadParams = bad.filter((b) => !['from', 'ids'].includes(b));
  S.route = m.route;
  S.params = m.params;
  if (m.route === 'explore') S.filters = filters;
  applying = false;
  emit(m.route);
}
function initRouter() {
  window.addEventListener('hashchange', apply);

}

/* ── шортлист ── */

const LS_KEY = 'kvi.shortlist.v1';
let memoryFallback = null;
let storageBlocked = false;

function readStore() {
  if (memoryFallback) return memoryFallback;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return { v: 1, items: [] };
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.items)) throw new Error('bad shape');
    return parsed;
  } catch (e) {
    // Испорченный блоб не должен заклинить приложение.
    try { localStorage.setItem(`${LS_KEY}.corrupt`, localStorage.getItem(LS_KEY) || ''); localStorage.removeItem(LS_KEY); } catch { /* */ }
    storageBlocked = true;
    memoryFallback = { v: 1, items: [] };
    return memoryFallback;
  }
}
function writeStore(data) {
  if (memoryFallback) { memoryFallback = data; return; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {
    storageBlocked = true;
    memoryFallback = data;
  }
}
const shortlist = {
  ids() { return new Set(readStore().items.map((i) => i.id)); },
  has(id) { return this.ids().has(id); },
  count() { return readStore().items.length; },
  toggle(id) {
    const d = readStore();
    const i = d.items.findIndex((x) => x.id === id);
    if (i >= 0) d.items.splice(i, 1);
    else {
      if (d.items.length >= 100) return { ok: false, reason: 'Шортлист вмещает 100 игроков' };
      d.items.push({ id, addedAt: new Date().toISOString() });

    return { ok: true, added: i < 0 };
  },
  clear() { writeStore({ v: 1, items: [] }); emit('shortlist'); },

// Две вкладки не должны драться за список.
window.addEventListener('storage', (e) => { if (e.key === LS_KEY) emit('shortlist'); });

/* ═══ отбор выборки ═══

   Единственное место, где фильтруют и сортируют. Виды этого не делают —
   именно так гарантия «фильтр не пересчитывает модель» становится
   свойством архитектуры, а не комментарием в коде.

   Модель посчитана один раз по всей популяции (251 игрок). Здесь только
   подмножество: μ, σ и нормализация не трогаются.                        */





let memoKey = null;
let memoValue = null;

const STRING_KEYS = new Set(['name', 'club', 'pos']);
function cohort(players, f) {
  const key = JSON.stringify([
    f.q, f.grp, f.club, f.age, f.mv, f.min, f.cat, f.nomodel, f.list, f.sort, f.dir,
    f.list ? [...shortlist.ids()].sort() : 0,
  ]);
  if (key === memoKey) return memoValue;

  const listIds = f.list ? shortlist.ids() : null;
  const rows = players.filter((p) => {
    if (!f.nomodel && !p.inModel) return false;
    if (listIds && !listIds.has(p.id)) return false;
    if (f.grp !== 'ALL' && p.group !== f.grp) return false;
    if (f.club && p.club !== f.club) return false;
    if (p.age < f.age[0] || p.age > f.age[1]) return false;
    if (p.minutes < f.min[0] || p.minutes > f.min[1]) return false;
    if (p.mv != null && (p.mv < f.mv[0] || p.mv > f.mv[1])) return false;
    // Игрок без стоимости попадает в выборку только при полном диапазоне.
    if (p.mv == null && (f.mv[0] !== 0 || f.mv[1] !== 1500000)) return false;
    if (f.cat.length && (!p.catKey || !f.cat.includes(p.catKey))) return false;
    if (f.q && !matchesQuery(p, f.q)) return false;
    return true;
  });

  const k = f.sort;
  const d = f.dir;
  const sorted = [...rows].sort((a, b) => {
    // Категория — порядковая величина, сортируем по UI, а не по алфавиту.
    if (k === 'cat') {
      const av = a.ui; const bv = b.ui;
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return d * (av - bv);

    let x = a[k]; let y = b[k];
    if (x == null && y == null) return 0;
    if (x == null) return 1;      // пропуски всегда в конце
    if (y == null) return -1;
    if (STRING_KEYS.has(k)) return d * collator.compare(x, y);
    return d * (x - y);

  const inModel = sorted.filter((p) => p.inModel).length;
  memoKey = key;
  memoValue = { rows: sorted, counts: { total: sorted.length, inModel, outOfModel: sorted.length - inModel } };
  return memoValue;
}

/** Активные фильтры для строки чипов: только то, что реально сужает выборку. */
function activeChips(f, DEFAULTS) {

    chips.push({ key: 'mv', label: `Стоимость: ${s(f.mv[0])} – ${s(f.mv[1])} €` });

/**
 * Корреляция по выборке — но честно.
 *
 * Фильтр по стоимости усекает ту же переменную, против которой считается r,
 * поэтому усечение механически занижает коэффициент. Показывать такое
 * число как находку нельзя.
 */
function cohortCorrelation(rows, f, DEFAULTS) {
  const m = rows.filter((p) => p.inModel);
  const truncating = [];
  if (f.mv[0] !== DEFAULTS.mv[0] || f.mv[1] !== DEFAULTS.mv[1]) truncating.push('стоимости');
  if (f.age[0] !== DEFAULTS.age[0] || f.age[1] !== DEFAULTS.age[1]) truncating.push('возрасту');
  if (f.min[0] !== DEFAULTS.min[0] || f.min[1] !== DEFAULTS.min[1]) truncating.push('минутам');
  if (truncating.length) {
    return { state: 'truncated', n: m.length, by: truncating };
  }
  if (m.length < 30) return { state: 'small', n: m.length };
  const xs = m.map((p) => p.nk); const ys = m.map((p) => p.nmv);
  const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
  const mx = mean(xs); const my = mean(ys);
  let sxy = 0; let sxx = 0; let syy = 0;
  for (let i = 0; i < xs.length; i++) { const a = xs[i] - mx; const b = ys[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }

    else return;
    e.preventDefault();
    setRoving(next);
    nodes.get(next).focus();
  });

  return {
    node: s,
    /** Фильтрация меняет только классы — ни один узел не пересоздаётся. */
    update(cohortRows, selId) {
      const inCohort = new Set(cohortRows.filter((p) => p.inModel).map((p) => p.id));
      for (const [id, g] of nodes) {
        g.classList.toggle('is-dim', !inCohort.has(id));
        g.classList.toggle('is-sel', id === selId);
      }
      // Подписи и линия регрессии зависят от выборки — их ~10 узлов.
      gLabels.innerHTML = '';
      gTrend.innerHTML = '';
      const m = cohortRows.filter((p) => p.inModel);
      if (m.length > 2) {
        const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
        const mx = mean(m.map((p) => p.nmv)); const my = mean(m.map((p) => p.nk));
        let sxy = 0; let sxx = 0;
        m.forEach((p) => { sxy += (p.nmv - mx) * (p.nk - my); sxx += (p.nmv - mx) ** 2; });
        if (sxx > 0) {
          const b = sxy / sxx; const a = my - b * mx;
          // Линия чертится только в пределах x выборки, а не через весь холст.
          const cx0 = Math.min(...m.map((p) => p.nmv)); const cx1 = Math.max(...m.map((p) => p.nmv));
          svg('line', { x1: X(cx0), y1: Y(a + b * cx0), x2: X(cx1), y2: Y(a + b * cx1), class: 'trend' }, gTrend);
        }
      }
      const placed = [];
      for (const p of [...m].sort((a, b) => b.ui - a.ui).slice(0, 6)) {
        const nm = p.name.split(' ').slice(-1)[0];
        const w = nm.length * 6.4 + 6;
        let box = null;
        for (const [dx, dy] of [[10, -10], [10, 14], [-10 - w, -10], [-10 - w, 14]]) {
          const bx = X(p.nmv) + dx; const by = Y(p.nk) + dy;
          if (bx < pad.l + 2 || bx + w > pad.l + iw - 2 || by - 12 < pad.t || by > pad.t + ih) continue;
          if (placed.some((q) => !(bx + w < q.x || q.x + q.w < bx || by < q.y - 13 || q.y < by - 13))) continue;
          box = { x: bx, y: by, w }; break;
        }
        if (!box) continue;
        placed.push(box);
        svg('text', { x: box.x, y: box.y, class: 'ptlab halo' }, gLabels).textContent = nm;
        svg('text', { x: box.x, y: box.y, class: 'ptlab' }, gLabels).textContent = nm;
      }
    },
    focusPlayer(id) { const g = nodes.get(id); if (g) { setRoving(id); g.focus(); } },
  };
}

/* ────────────────────── водопад вкладов ────────────────────── */

/**
 * Из чего сложился индекс: вклад wᵢ × zᵢ, в сумме дающий KVI.
 * Заменяет прежний радар. У радара четвёртый луч был синтетическим —
 * несобранная метрика рисовалась ровно на среднем уровне группы,
 * то есть выглядела как «ровно средний игрок». Здесь несобранная
 * метрика — это штриховка и явная подпись, а не точка на полигоне.
 */
function waterfallHTML(p, METRICS, weff, AVAIL, coverage) {
  const maxAbs = Math.max(...p.contrib.map((c) => Math.abs(c ?? 0)), 0.01);
  const rows = METRICS.map((name, i) => {
    const c = p.contrib[i];
    const w = weff[p.group][i];
    const na = AVAIL[i] === 0;
    const pct = na ? 0 : (Math.abs(c) / maxAbs) * 50;
    const off = na ? 50 : (c >= 0 ? 50 : 50 - pct);
    return `<div class="wf__row${na ? ' is-na' : ''}">
      <div class="wf__label">${esc(name)}${na ? ' <span class="tag">не публикуется</span>' : ''}</div>
      <div class="wf__weight num">${na ? '—' : `×${w.toFixed(3)}`}</div>
      <div class="wf__track${na ? ' na-cell' : ''}"><span class="wf__mid"></span>
        ${na ? '' : `<span class="wf__bar" style="left:${off}%;width:${pct}%;background:${c >= 0 ? 'var(--val-under-strong)' : 'var(--val-over-strong)'}"></span>`}
      </div>
      <div class="wf__val num">${na ? '—' : f3(c)}</div>
    </div>`;
  }).join('');
  return `<div class="wf">
    <div class="wf__head"><span>показатель</span><span class="num">вес</span><span>вклад</span><span class="num">wᵢ × zᵢ</span></div>
    ${rows}
    <div class="wf__row wf__row--total">
      <div class="wf__label">KVI — сумма вкладов</div><div></div><div></div>
      <div class="wf__val num">${f3(p.kvi)}</div>
    </div>
  </div>
  <p class="cap">Вклад = вес показателя × его z-оценка внутри группы ${p.group}.
  Вес «Отборов + Перехватов» перераспределён между собранными метриками:
  покрытие группы ${Math.round(coverage[p.group] * 100)}${NBSP}%.</p>`;
}

/* ────────────────── полоса разрыва цены и игры ────────────────── */

/** Тот же 45° приём, сплющенный в одну ось: засечка = справедливая цена. */
function valueGapHTML(ui) {
  if (ui == null) return '';
  const clamped = Math.max(-3, Math.min(3, ui));
  const pct = (Math.abs(clamped) / 3) * 50;
  const off = clamped >= 0 ? 50 : 50 - pct;
  const color = clamped >= 0 ? 'var(--val-under-strong)' : 'var(--val-over-strong)';
  return `<span class="gap" aria-hidden="true"><span class="gap__mid"></span><span class="gap__bar" style="left:${off}%;width:${pct}%;background:${color}"></span></span>`;
}

/* ──────────────────── распределение по группам ──────────────────── */
function renderDistribution(root, model, cohortIds) {
  const W = 900; const H = 210;
  const pad = { l: 46, r: 18, t: 16, b: 34 };
  const iw = W - pad.l - pad.r;
  const rowH = (H - pad.t - pad.b) / 3;
  const lo = -3; const hi = 3;
  const X = (v) => pad.l + ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * iw;

  root.innerHTML = '';
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'dist', role: 'img', 'aria-label': 'Распределение KVI_adj по позиционным группам' }, root);
  for (let v = lo; v <= hi; v += 1) {
    svg('line', { x1: X(v), y1: pad.t, x2: X(v), y2: H - pad.b, class: 'gridline' }, s);
    svg('text', { x: X(v), y: H - pad.b + 16, class: 'axlab', 'text-anchor': 'middle' }, s)
      .textContent = String(v).replace('-', '−');
  }
  ['FW', 'MF', 'DF'].forEach((g, i) => {
    const y = pad.t + rowH * i + rowH / 2;
    svg('text', { x: 10, y: y + 4, class: 'axlab' }, s).textContent = g;
    const sub = model.filter((p) => p.group === g);
    if (!sub.length) return;
    const vals = sub.map((p) => p.kvi_adj).sort((a, b) => a - b);
    const q = (f) => { const pos = (vals.length - 1) * f; const b = Math.floor(pos); const r = pos - b; return vals[b + 1] !== undefined ? vals[b] + r * (vals[b + 1] - vals[b]) : vals[b]; };
    // Явные токены: в прежней версии здесь стояли необъявленные переменные,
    // и коробка с усами рисовалась чёрным по почти чёрному, то есть не рисовалась.
    svg('line', { x1: X(q(0.1)), y1: y, x2: X(q(0.9)), y2: y, class: 'dist__whisker' }, s);
    svg('rect', { x: X(q(0.25)), y: y - 9, width: Math.max(1, X(q(0.75)) - X(q(0.25))), height: 18, class: 'dist__box' }, s);
    for (const p of sub) {
      const dot = svg('circle', { cx: X(p.kvi_adj), cy: y, r: 2.4, class: 'dist__dot' }, s);
      dot.setAttribute('fill', catMeta(p.catKey).color);
      if (cohortIds && !cohortIds.has(p.id)) dot.setAttribute('opacity', '.12');
    }
    svg('line', { x1: X(q(0.5)), y1: y - 12, x2: X(q(0.5)), y2: y + 12, class: 'dist__median' }, s);
  });
  svg('text', { x: pad.l + iw / 2, y: H - 6, class: 'axtitle', 'text-anchor': 'middle' }, s).textContent = 'KVI_adj';
}

const pluralPoints = (n) => `${n}${NBSP}${plural(n, 'точка', 'точки', 'точек')}`;

/* ═══ реестр игроков ═══

   Раньше таблица пересобиралась целиком на каждое нажатие клавиши:
   5117 элементов через innerHTML плюс 301 обработчик, 39 мс из 54 мс
   полной перерисовки, и положение прокрутки сбрасывалось на каждый символ.

   Здесь строки создаются один раз, а дальше только переставляются и
   прячутся. Разметка строки — чистая функция игрока (ни один форматтер
   не читает состояние), поэтому её можно посчитать заранее.             */
const COLUMNS = [
  { k: 'rankAll', t: '#', right: 1, w: '52px', cell: (p) => (p.inModel ? p.rankAll : '—') },
  { k: 'name', t: 'Игрок', w: '168px', cell: (p) => `${esc(p.name)}${p.inModel ? '' : ' <span class="tag">вне модели</span>'}` },
  { k: 'pos', t: 'Поз', w: '58px', cell: (p) => `<span class="tag">${p.pos}</span>` },
  { k: 'club', t: 'Клуб', w: '132px', cell: (p) => esc(p.club) },
  { k: 'age', t: 'Возр', right: 1, w: '60px', cell: (p) => p.age },
  { k: 'minutes', t: 'Мин', right: 1, w: '70px', cell: (p) => fInt(p.minutes) },
  { k: 'rating', t: 'Рейтинг', right: 1, w: '74px', cell: (p) => p.rating.toFixed(2) },
  { k: 'mv', t: 'Стоимость', right: 1, w: '104px', cell: (p) => (p.mv == null ? naCell('Нет рыночной стоимости на дату среза 15.09.2026') : fEur(p.mv)) },
  { k: 'kvi_adj', t: 'KVI_adj', right: 1, w: '84px', cell: (p) => (p.inModel ? f2(p.kvi_adj) : '—') },
  { k: 'ui', t: 'UI', right: 1, w: '132px', cell: (p) => (p.inModel ? `${valueGapHTML(p.ui)}<span class="gap__num">${f3(p.ui)}</span>` : '—') },
  { k: 'cat', t: 'Статус', w: '150px', cell: (p) => (p.inModel ? catPill(p.catKey, { short: true }) : `<span class="pill pill--fair" title="${esc(EXCL_LABEL[p.exclCode] || '')}">исключён</span>`) },
];
function createTable(root, players, { onSelect, onToggleList, isListed }) {
  root.innerHTML = `
    <table>
      <caption class="visually-hidden">Реестр игроков КПЛ с индексом недооценённости</caption>
      <thead><tr>${COLUMNS.map((c) => `<th scope="col" data-k="${c.k}" style="width:${c.w}" class="${c.right ? 'right' : ''}">
        <button type="button" class="th-btn">${c.t}<span class="sort-ind" aria-hidden="true"></span></button></th>`).join('')}
        <th scope="col" style="width:46px"><span class="visually-hidden">Шортлист</span></th>
      </tr></thead>
      <tbody></tbody>
    </table>`;
  const tbody = root.querySelector('tbody');
  const thead = root.querySelector('thead');

  // Разметка строки считается один раз на игрока.
  const rowNodes = new Map();
  for (const p of players) {
    const tr = document.createElement('tr');
    tr.dataset.id = p.id;
    tr.tabIndex = -1;
    tr.setAttribute('role', 'row');
    if (!p.inModel) tr.className = 'is-out';
    tr.innerHTML = COLUMNS.map((c) => `<td class="${c.right ? 'right' : ''}${c.k === 'mv' && p.mv == null ? ' na-cell' : ''}">${c.cell(p)}</td>`).join('')
      + `<td class="right"><button type="button" class="star" data-star="${p.id}" aria-pressed="false" aria-label="Добавить ${esc(p.name)} в шортлист">☆</button></td>`;
    rowNodes.set(p.id, tr);
  }

  // Делегирование: один обработчик вместо 301.
  tbody.addEventListener('click', (e) => {
    const star = e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); onToggleList(Number(star.dataset.star)); return; }
    const tr = e.target.closest('tr');
    if (tr) onSelect(Number(tr.dataset.id));
  });
  tbody.addEventListener('keydown', (e) => {
    const tr = e.target.closest('tr');
    if (!tr) return;
    if (e.key === 'Enter' || e.key === ' ') {
      if (e.target.closest('[data-star]')) return;
      e.preventDefault(); onSelect(Number(tr.dataset.id));
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const rows = [...tbody.querySelectorAll('tr:not([hidden])')];
      const i = rows.indexOf(tr);
      const next = rows[e.key === 'ArrowDown' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1)];
      if (next) { next.tabIndex = 0; tr.tabIndex = -1; next.focus(); }
    }
  });

  let sortHandler = null;
  thead.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-k]');
    if (th && sortHandler) sortHandler(th.dataset.k);
  });

  return {
    onSort(fn) { sortHandler = fn; },
    update(rows, { sort, dir, selId, listed }) {
      // Перестановка существующих узлов: ни один элемент не создаётся.
      const frag = document.createDocumentFragment();
      const visible = new Set();
      rows.forEach((p) => { visible.add(p.id); frag.appendChild(rowNodes.get(p.id)); });
      tbody.appendChild(frag);
      for (const [id, tr] of rowNodes) {
        const on = visible.has(id);
        tr.hidden = !on;
        if (!on && tr.parentNode === tbody) continue;
        const sel = id === selId;
        tr.setAttribute('aria-selected', sel ? 'true' : 'false');
        tr.tabIndex = sel ? 0 : -1;
        const star = tr.querySelector('.star');
        const inList = listed.has(id);
        star.textContent = inList ? '★' : '☆';
        star.setAttribute('aria-pressed', inList ? 'true' : 'false');
      }
      if (![...rowNodes.values()].some((tr) => !tr.hidden && tr.tabIndex === 0)) {
        const first = rows[0] && rowNodes.get(rows[0].id);
        if (first) first.tabIndex = 0;
      }
      for (const th of thead.querySelectorAll('th[data-k]')) {
        const on = th.dataset.k === sort;
        if (on) th.setAttribute('aria-sort', dir < 0 ? 'descending' : 'ascending');
        else th.removeAttribute('aria-sort');
        th.querySelector('.sort-ind').textContent = on ? (dir < 0 ? '↓' : '↑') : '';
      }
    },
    focusPlayer(id) { const tr = rowNodes.get(id); if (tr && !tr.hidden) { tr.tabIndex = 0; tr.focus(); } },
    scrollToPlayer(id) { const tr = rowNodes.get(id); if (tr && !tr.hidden) tr.scrollIntoView({ block: 'nearest' }); },
  };
}

/* ═══ досье игрока ═══ переиспользуется инспектором, профилем и сравнением */






function kv(label, value, delta) {
  return `<div class="kv"><span>${label}</span><b>${value}${delta || ''}</b></div>`;
}
/** Отклонение от среднего по позиционной группе — знаком и цветом. */
function vs(val, mu, digits = 2) {
  if (val == null || mu == null) return '';
  const d = val - mu;
  const t = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(Math.abs(d) >= 10 ? 0 : digits);
  return `<i class="kv__delta ${d >= 0 ? 'is-up' : 'is-dn'}">${t} к ср.</i>`;
}
function cardHeadHTML(p, { level = 2 } = {}) {
  const link = `https://www.sofascore.com/player/${p.slug}/${p.sf_id}`;
  const meta = [
    `${p.pos} · ${GROUP_LABEL[p.group] || p.group}`,
    esc(p.club),
    `${p.age}${NBSP}${plural(p.age, 'год', 'года', 'лет')}`,
    p.nat ? esc(p.nat) : '<span class="na" title="Гражданство не указано в источнике">—</span>',
  ].join(' · ');
  return `<div class="card__head">
    <h${level} class="display d3 card__name">${esc(p.name)}</h${level}>
    <p class="card__meta">${meta} · <a href="${link}" target="_blank" rel="noopener">SofaScore ↗</a></p>
    ${p.inModel ? `<div class="card__headline">
        <div class="card__ui">
          <span class="overline">Индекс недооценённости</span>
          <span class="display d2 card__uiv" style="color:${catMeta(p.catKey).color}">${f3(p.ui)}</span>
        </div>
        <div class="card__badges">
          ${catPill(p.catKey)}
          <span class="card__rank num">${p.rankGrp}<span class="card__rank-of"> / ${p.rankGrpN} в ${p.group}</span></span>
        </div>
      </div>`
    : `<div class="card__headline card__headline--out">
        <span class="pill pill--fair">вне модели</span>
        <span class="cap">${esc(EXCL_LABEL[p.exclCode] || p.excl)}</span>
      </div>`}
  </div>`;
}
function cardBodyHTML(p, built, { compact = false } = {}) {
  if (!p.inModel) {
    return `<section class="card__sec">
      <h3 class="overline">Собранные показатели</h3>
      <p class="cap">Показатели собраны, но рейтинг модели не рассчитывается — значения не подменялись.</p>
      <div class="kvgrid">
        ${kv('Минуты', fInt(p.minutes))}${kv('Матчей', p.apps)}
        ${kv('Голы', p.goals)}${kv('Ассисты', p.assists)}
        ${kv('Ключевые передачи', p.key_passes)}${kv('Выигранные дуэли', p.duels_won)}
        ${kv('Дриблинги', p.dribbles)}${kv('Рейтинг', p.rating.toFixed(2))}
        ${kv('Точность пасов', `${p.pass_pct.toFixed(1)}%`)}
        ${kv('Стоимость', p.mv == null ? naCell('Нет рыночной стоимости на дату среза') : fEur(p.mv))}
      </div>
    </section>`;
  }

  const st = built.stats[p.group];
  const stats = `<section class="card__sec">
    <h3 class="overline">Сезон 2026 · сравнение со средним по группе ${p.group}</h3>
    <div class="kvgrid">
      ${kv('Минуты', fInt(p.minutes), vs(p.minutes, st.mu[6], 0))}
      ${kv('Матчей / в старте', `${p.apps} / ${p.starts}`)}
      ${kv('Голы', p.goals, vs(p.goals, st.mu[0]))}
      ${kv('Голы / 90', f2(p.g90))}
      ${kv('Ассисты', p.assists, vs(p.assists, st.mu[1]))}
      ${kv('Ассисты / 90', f2(p.a90))}
      ${kv('Ключевые передачи', p.key_passes, vs(p.key_passes, st.mu[2]))}
      ${kv('Кл. передачи / 90', f2(p.kp90))}
      ${kv('Выигранные дуэли', p.duels_won, vs(p.duels_won, st.mu[4], 0))}
      ${kv('Дуэли / 90', f2(p.d90))}
      ${kv('Успешные дриблинги', p.dribbles)}
      ${kv('Точность пасов', `${p.pass_pct.toFixed(1)}%`)}
      ${kv('Рейтинг SofaScore', p.rating.toFixed(2), vs(p.rating, st.mu[5]))}
      ${kv('Отборы + Перехваты', naCell('SofaScore не публикует эту метрику по КПЛ ни за один сезон'))}
      ${kv('Дата рождения', fDate(p.dob))}
      ${kv('Стоимость', fEur(p.mv))}
    </div>
  </section>`;

  const model = `<section class="card__sec">
    <h3 class="overline">Модель</h3>
    <div class="kvgrid">
      ${kv('KVI', f2(p.kvi))}${kv('AAF — возраст', p.aaf.toFixed(3))}
      ${kv('KVI_adj', f2(p.kvi_adj))}${kv('норм. KVI_adj', f2(p.nk))}
      ${kv('норм. стоимость', f2(p.nmv))}${kv('UI = разность', f3(p.ui))}
      ${kv(`Ранг по UI в ${p.group}`, `${p.rankGrp} / ${p.rankGrpN}`)}
      ${kv('Ранг по KVI_adj', `${p.rankKvi} / ${built.model.length}`)}
    </div>
    <p class="cap">Ранг по лиге — ${p.rankAll} из ${built.model.length}. Он сопоставляет
    величины, нормализованные внутри разных групп, поэтому опираться стоит
    на ранг внутри группы.</p>
  </section>`;

  const decomposition = `<section class="card__sec">
    <h3 class="overline">Из чего сложился индекс</h3>
    ${waterfallHTML(p, METRICS, built.weff, AVAIL, built.coverage)}
  </section>`;

  return compact ? decomposition + stats : decomposition + stats + model;
}
function cardHTML(p, built, opts = {}) {
  if (!p) return '<div class="empty">Игрок не выбран</div>';
  return cardHeadHTML(p, opts) + cardBodyHTML(p, built, opts);
}

let tipNode = null;
function tooltip(id, anchor) {
  if (!tipNode) tipNode = el('tip');
  if (!id) { tipNode.classList.remove('is-on'); return; }
  const p = byId(id);
  if (!p) return;
  tipNode.innerHTML = `<b>${esc(p.name)}</b>
    <span class="tip__sub">${p.pos} · ${esc(p.club)} · ${p.age}${NBSP}${plural(p.age, 'год', 'года', 'лет')}</span>
    <span class="tip__r"><span>KVI_adj</span><b>${f2(p.kvi_adj)}</b></span>
    <span class="tip__r"><span>Стоимость</span><b>${fEurShort(p.mv)}</b></span>
    <span class="tip__r"><span>UI</span><b style="color:${catMeta(p.catKey).color}">${f3(p.ui)}</b></span>`;
  tipNode.classList.add('is-on');
  // Позиционируемся от геометрии точки, а не от курсора: тогда подсказка
  // работает и с клавиатуры, и не требует чтения layout на каждое движение.
  const r = anchor.getBoundingClientRect();
  const w = 230; const h = tipNode.offsetHeight || 110;
  let x = r.right + 12; let y = r.top - 8;
  if (x + w > innerWidth - 8) x = r.left - w - 12;
  if (y + h > innerHeight - 8) y = innerHeight - h - 8;
  tipNode.style.left = `${Math.max(8, x)}px`;
  tipNode.style.top = `${Math.max(8, y)}px`;
}

    table = createTable(el('tablewrap'), built.players, {

    scatter = createScatter(el('ex-scatter'), built.model, {
      onSelect: (id) => selectPlayer(id),
      onHover: (id, node) => tooltip(id, node),
    });
