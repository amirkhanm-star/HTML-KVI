  exploreUI = { table, scatter };
  wireRail();
  refresh();

  // Возврат из профиля: восстанавливаем положение и фокус.
  const key = serializeFilters(S.filters);
  const saved = restoreView(`explore:${key}`);
  if (saved) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo(0, saved.win || 0);
      if (saved.focusId && table) table.focusPlayer(saved.focusId);
    }));
  }

  function selectPlayer(id) {
    const nf = { ...S.filters, sel: S.filters.sel === id ? null : id };
    goReplace('explore', {}, nf);   // выбор точки — не переход, историю не пишем
  }

  function refresh() {
    const ff = S.filters;
    const { rows, counts } = cohort(built.players, ff);
    const listed = shortlist.ids();
    const sel = ff.sel;

    el('cohort-title').textContent = counts.outOfModel
      ? `${nPlayers(counts.inModel)} в модели · ещё ${counts.outOfModel} вне модели`
      : `${nPlayers(counts.inModel)} в модели`;

    const chips = activeChips(ff, DEFAULTS);
    el('chipbar').innerHTML = chips.length
      ? `${chips.map((c) => `<button type="button" class="chip" data-drop="${c.key}">${esc(c.label)}<span aria-hidden="true">✕</span><span class="visually-hidden">— снять фильтр</span></button>`).join('')}
         <button type="button" class="btn btn--quiet btn--sm" id="reset-all">Сбросить всё</button>`
      : '<span class="cap">Фильтры не заданы — показана вся модель.</span>';

    const c = cohortCorrelation(rows, ff, DEFAULTS);
    el('corr').innerHTML = c.state === 'ok'
      ? `<span class="overline">Корреляция в выборке</span> <b class="num">${f2(c.r)}</b> <span class="cap">n = ${c.n}</span>`
      : c.state === 'small'
        ? `<span class="overline">Корреляция в выборке</span> <span class="cap">не показывается: n = ${c.n}, меньше 30 наблюдений</span>`
        : `<span class="overline">Корреляция в выборке</span> <span class="cap cap--warn">не показывается: фильтр по ${c.by.join(' и ')} усекает ту же переменную, по которой считается коэффициент. Полная модель: r = ${f2(built.summary.correlation.all)} при n = ${built.summary.counts.model}.</span>`;

    if (table) table.update(rows, { sort: ff.sort, dir: ff.dir, selId: sel, listed });
    if (scatter) scatter.update(rows, sel);

    el('inspector').innerHTML = sel
      ? inspectorHTML(byId(sel), rows.some((p) => p.id === sel))
      : `<div class="inspector__empty"><p class="cap">Выберите игрока в ${ff.view === 'chart' ? 'графике' : 'таблице'}, чтобы увидеть разбор индекса.</p></div>`;
    root.querySelector('.explore').classList.toggle('has-sel', sel != null);

    // Пустое состояние — сосед таблицы, а не её замена: контейнер живёт всегда,
    // иначе обновление после сброса фильтра пришлось бы монтировать заново.
    const container = el('tablewrap') || el('chartwrap');
    const emptyBox = el('empty-state');
    if (!rows.length) {
      const most = chips.length ? chips[chips.length - 1] : null;
      const inModelTotal = built.players.filter((p) => {
        if (ff.grp !== 'ALL' && p.group !== ff.grp) return false;
        if (ff.club && p.club !== ff.club) return false;
        return true;
      });
      const onlyExcluded = inModelTotal.length && !inModelTotal.some((p) => p.inModel);
      emptyBox.innerHTML = `<div class="empty">
        <p class="h1">${onlyExcluded ? `Найдено ${nPlayers(inModelTotal.length)}, но ни один не входит в модель` : 'Ни один игрок не подходит под фильтры'}</p>
        ${onlyExcluded ? '<p class="cap"><a href="#/method/exclusions">Почему игроки исключаются →</a></p>' : ''}
        ${most ? `<p class="cap">Самый узкий из активных: ${esc(most.label)}.</p>
          <button type="button" class="btn btn--sm" data-drop="${most.key}">Снять этот фильтр</button>` : ''}
        <button type="button" class="btn btn--sm" id="reset-empty">Сбросить все фильтры</button></div>`;
      emptyBox.hidden = false;
      if (container) container.hidden = true;
    } else {
      emptyBox.hidden = true;
      if (container) container.hidden = false;
    }
    announce(`Найдено ${nPlayers(counts.inModel)} в модели`);
    el('list-n') && (el('list-n').textContent = shortlist.count());
  }

  function wireRail() {
    const rail = el('rail');
    rail.addEventListener('submit', (e) => e.preventDefault());

    let qTimer = null;
    el('f-q').addEventListener('input', (e) => {
      // Ввод — непрерывное действие: историю не пишем, отрисовку придерживаем.
      clearTimeout(qTimer);
      const v = e.target.value;
      qTimer = setTimeout(() => goReplace('explore', {}, { ...S.filters, q: v }), 140);
    });
    el('f-club').addEventListener('change', (e) => go('explore', {}, { ...S.filters, club: e.target.value }));
    el('f-grp').addEventListener('click', (e) => {
      const b = e.target.closest('[data-g]');
      if (b) go('explore', {}, { ...S.filters, grp: b.dataset.g });
    });
    el('f-nomodel').addEventListener('change', (e) => go('explore', {}, { ...S.filters, nomodel: e.target.checked ? 1 : 0 }));
    el('f-list').addEventListener('change', (e) => go('explore', {}, { ...S.filters, list: e.target.checked ? 1 : 0 }));
    rail.querySelectorAll('[data-cat]').forEach((cb) => cb.addEventListener('change', () => {
      const cats = [...rail.querySelectorAll('[data-cat]:checked')].map((x) => x.dataset.cat);
      go('explore', {}, { ...S.filters, cat: cats });
    }));
    for (const key of ['age', 'mv', 'min']) wireRange(key);

    document.addEventListener('click', railClicks);
    root.addEventListener('click', (e) => {
      const v = e.target.closest('[data-view]');
      if (v) go('explore', {}, { ...S.filters, view: v.dataset.view });
      if (e.target.id === 'rail-toggle') {
        const wrap = root.querySelector('.explore');
        const open = wrap.classList.toggle('rail-open');
        e.target.setAttribute('aria-expanded', String(open));
      }
      if (e.target.id === 'copy-link') {
        navigator.clipboard?.writeText(location.href).then(
          () => announce('Ссылка на выборку скопирована'),
          () => announce('Не удалось скопировать — скопируйте адрес из строки браузера'),
        );
      }
    });
  }

  function railClicks(e) {
    const drop = e.target.closest('[data-drop]');
    if (drop) {
      const nf = { ...S.filters };
      const k = drop.dataset.drop;
      nf[k] = Array.isArray(DEFAULTS[k]) ? [...DEFAULTS[k]] : DEFAULTS[k];
      if (k === 'cat') nf.cat = [];
      go('explore', {}, nf);
    }
    if (e.target.id === 'reset-all' || e.target.id === 'reset-empty') {
      go('explore', {}, { ...DEFAULTS, age: [...DEFAULTS.age], mv: [...DEFAULTS.mv], min: [...DEFAULTS.min], cat: [], view: S.filters.view });
    }
  }

  function wireRange(key) {
    const lo = el(`f-${key}-lo`); const hi = el(`f-${key}-hi`);
    if (!lo) return;
    const push = () => {
      let a = Number(lo.value); let b = Number(hi.value);
      if (a > b) [a, b] = [b, a];
      goReplace('explore', {}, { ...S.filters, [key]: [a, b] });
    };
    lo.addEventListener('input', push);
    hi.addEventListener('input', push);
  }

  exploreUI.refresh = refresh;
  return refresh;
}

function rangeControl(key, label, val, def, fmt, step = 1) {
  return `<div class="rail__grp">
    <span class="overline" id="lbl-${key}">${label}</span>
    <div class="range">
      <input type="range" id="f-${key}-lo" min="${def[0]}" max="${def[1]}" step="${step}" value="${val[0]}"
        aria-labelledby="lbl-${key}" aria-label="${label}: нижняя граница" aria-valuetext="${fmt(val[0])}">
      <input type="range" id="f-${key}-hi" min="${def[0]}" max="${def[1]}" step="${step}" value="${val[1]}"
        aria-labelledby="lbl-${key}" aria-label="${label}: верхняя граница" aria-valuetext="${fmt(val[1])}">
    </div>
    <output class="range__out num" for="f-${key}-lo f-${key}-hi">${fmt(val[0])} — ${fmt(val[1])}</output>
  </div>`;
}

function inspectorHTML(p, inCohort) {

    </div>
    ${cardBodyHTML(p, built, { compact: true })}`;
}

function similarHTML(p) {
  // Косинусное расстояние по вектору z внутри группы: дёшево и осмысленно.
  const peers = built.model.filter((q) => q.group === p.group && q.id !== p.id);
  const dot = (a, b) => a.reduce((s, x, i) => (x == null || b[i] == null ? s : s + x * b[i]), 0);
  const norm = (a) => Math.sqrt(dot(a, a));
  const np = norm(p.z);
  const scored = peers.map((q) => ({ q, sim: np && norm(q.z) ? dot(p.z, q.z) / (np * norm(q.z)) : -1 }))
    .sort((a, b) => b.sim - a.sim).slice(0, 5);
  return `<section class="card__sec">
    <h3 class="overline">Похожие по профилю в группе ${p.group}</h3>
    <ul class="similar">
      ${scored.map(({ q, sim }) => `<li>
        <a href="${buildHash('player', { id: q.id })}">${esc(q.name)}</a>
        <span class="tag">${q.pos}</span>
        <span class="cap">${esc(q.club)}</span>
        <span class="num">${f2(q.ui)}</span>
        <span class="cap">сходство ${Math.round(sim * 100)}%</span></li>`).join('')}
    </ul>
    <p class="cap">Сходство — косинус между векторами z-оценок. Сравниваются только игроки
      одной группы: вектора нормализованы внутри неё.</p>
  </section>`;
}

function cmpTable(rows, players, withDelta, mixed = false) {
  return `<div class="tablewrap tablewrap--cmp"><table>
    <thead><tr><th scope="col">Показатель</th>
      ${players.map((p) => `<th scope="col" class="right">${esc(p.name.split(' ').slice(-1)[0])}<span class="tag">${p.group}</span></th>`).join('')}
      ${withDelta && players.length === 2 ? '<th scope="col" class="right">Δ</th>' : ''}
    </tr></thead>
    <tbody>${rows.map(([label, fmt, num]) => {
    const cells = players.map((p) => `<td class="right">${fmt(p)}</td>`).join('');
    let delta = '';
    if (withDelta && players.length === 2 && num) {
      const a = num(players[0]); const b = num(players[1]);
      delta = `<td class="right num">${a == null || b == null ? '—' : f2(a - b)}</td>`;
    } else if (!withDelta && mixed) {
      delta = '';
    }
    return `<tr><th scope="row">${label}</th>${cells}${delta}</tr>`;
  }).join('')}</tbody></table></div>
  ${!withDelta && mixed ? '<p class="cap cap--warn">Δ не считается: у игроков разные референсные группы.</p>' : ''}`;
}

async function loadData() {
  // Собранный файл несёт данные внутри; исходники берут их запросом.
  if (typeof __PLAYERS__ !== 'undefined') return { players: __PLAYERS__, meta: __META__ };
  // Путь относительно документа: import.meta вне модуля недоступен,
  // а собранный файл — обычный скрипт.
  const base = new URL('data/', new URL('.', location.href));
  const [players, meta] = await Promise.all([
    fetch(new URL('players.json', base)).then((r) => r.json()),
    fetch(new URL('meta.json', base)).then((r) => r.json()),
  ]);
  return { players, meta };
}

function updateChrome() {
  for (const a of document.querySelectorAll('[data-nav]')) {
    const on = a.dataset.nav === S.route || (S.route === 'player' && a.dataset.nav === 'explore');
    a.setAttribute('aria-current', on ? 'page' : 'false');
  }
  const badge = el('list-badge');
  if (badge) badge.querySelector('b').textContent = shortlist.count();
  const warn = el('urlwarn');
  if (warn) {
    if (lastBadParams.length) {
      warn.hidden = false;
      warn.textContent = `Часть параметров ссылки не распознана и пропущена: ${lastBadParams.join(', ')}.`;
    } else warn.hidden = true;
  }
}

function render(check) {
  const root = el('view');
  const prev = mounted.route;
  const key = mountKey();

  // Смена фильтра внутри того же вида — обновление, а не пересборка:
  // именно здесь раньше терялись 80 мс и положение прокрутки.
  if (mounted.route === S.route && mounted.key === key && mounted.refresh) {
    mounted.refresh();
    updateChrome();
    return;
  }

  // Уходя из выборки, запоминаем прокрутку и фокус, чтобы вернуться в то же место.
  if (prev === 'explore' && S.route !== 'explore') {
    captureView(`explore:${serializeFilters(S.filters)}`, {
      win: window.scrollY,
      focusId: Number(document.activeElement?.closest?.('tr')?.dataset?.id) || null,
    });
  }

  tooltip(null);
  root.innerHTML = '';
  root.className = `view view--${S.route}`;

  let refresh = null;
  if (S.route === 'overview') viewOverview(root);
  else if (S.route === 'explore') refresh = viewExplore(root);
  else if (S.route === 'player') viewPlayer(root);
  else if (S.route === 'compare') viewCompare(root);
  else if (S.route === 'method') viewMethod(root, check);
  else viewNotFound(root);

  mounted = { route: S.route, key, refresh };
  updateChrome();

  if (prev && prev !== S.route) {
    root.focus({ preventScroll: true });
    if (S.route !== 'explore') window.scrollTo(0, 0);
  }
}

async function boot() {
  let data;
  try {
    data = await loadData();
  } catch (e) {
    document.body.innerHTML = `<div class="empty"><h1 class="h1">Не удалось загрузить данные</h1>
      <p class="cap">${esc(e.message)}</p></div>`;
    return;
  }

  const built = buildModel(data.players);
  const check = selfCheck(built);
  initViews(built, data.meta);
  setDomain({
    clubs: [...new Set(data.players.map((p) => p.club))],
    ids: new Set(built.players.map((p) => p.id)),
  });

  shell(data.meta, check);
  document.documentElement.classList.remove('is-booting');

  subscribe((reason) => {
    if (reason === 'shortlist') { invalidateCohort(); render(check); return; }
    render(check);
  });

  // Звёздочки шортлиста живут в разных видах — один обработчик на документ.
  document.addEventListener('click', (e) => {
    const star = e.target.closest('[data-star]');
    if (!star) return;
    e.preventDefault();
    const r = shortlist.toggle(Number(star.dataset.star));
    if (!r.ok) announce(r.reason);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (S.route === 'explore' && S.filters.sel != null) {
      go('explore', {}, { ...S.filters, sel: null }, { replace: true });
    } else {
      tooltip(null);
    }
  });

  initRouter();

  if (!check.ok) {
    document.body.classList.add('integrity-failed');
    console.error('KVI selfCheck failed', check.failed);
  } else {
    console.log('%cKVI', 'font-weight:bold', {
      'в базе': built.players.length, 'в модели': built.model.length,
      r: built.summary.correlation.all.toFixed(6),
      покрытие: ['FW', 'MF', 'DF'].map((g) => `${Math.round(built.coverage[g] * 100)}%`).join('/'),
    });
  }
  window.__KVI = { built, check };
}

boot();

})();
</script>
</body>
</html>
